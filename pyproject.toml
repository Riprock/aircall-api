[project]
name = "aircall-api"
version = "2.0.0"
description = "Python API Built to connect with aircall.io API Endpoints"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = [
    "aircall",
    "api",
    "telephony",
    "voip",
    "phone",
    "calls",
    "contacts",
    "sms",
    "messaging",
    "client",
    "sdk",
]
dependencies = [
    "pydantic>=2.12.4",
    "requests>=2.32.5",
]

[project.urls]
"Homepage" = "https://github.com/Riprock/aircall-api"
"Bug Tracker" = "https://github.com/Riprock/aircall-api/issues"
"Documentation" = "https://github.com/Riprock/aircall-api#readme"
"Repository" = "https://github.com/Riprock/aircall-api"

[dependency-groups]
dev = [
    "pylint>=4.0.2",
    "pytest>=8.4.2",
    "ruff>=0.14.3",
]

[tool.ruff]
# Pinned deliberately. Ruff's default rule set expands between releases, which is
# what turned CI red on the 0.16.6 upgrade without a line of code changing.
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific
]
# Complexity and refactor rules are pylint's job here; running both duplicates
# findings and disagrees on thresholds.

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
